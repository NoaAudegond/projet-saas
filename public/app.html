<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plania</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="mobile-bar">
    <span class="brand"><span class="brand-mark" style="width:28px;height:28px"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M5 6v12M12 6v7M19 6v4"/></svg></span> Plania</span>
    <button class="icon-btn" id="menu-toggle" type="button" aria-label="Ouvrir le menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>

  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/dashboard">
        <span class="brand-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M5 6v12M12 6v7M19 6v4"/></svg></span>
        Plania
      </a>
      <div class="company-chip">
        <span class="logo" id="company-logo">?</span>
        <div style="min-width:0"><strong id="company-name">…</strong><small id="company-slug"></small></div>
      </div>

      <nav aria-label="Navigation principale" style="display:grid;gap:2px">
        <a class="nav-link" href="#/dashboard" data-nav="dashboard"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Tableau de bord</a>
        <a class="nav-link" href="#/projects" data-nav="projects"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Projets<span class="count" id="projects-count"></span></a>
        <a class="nav-link" href="#/team" data-nav="team"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/></svg>Équipe</a>
        <a class="nav-link" href="#/settings" data-nav="settings" id="nav-settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21V14M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>Entreprise</a>
      </nav>

      <p class="nav-label">Mes projets</p>
      <div class="nav-projects" id="nav-projects"></div>

      <div class="sidebar-foot">
        <div style="display:flex;align-items:center;gap:4px">
          <button class="me" id="me" type="button" title="Modifier mon profil"></button>
          <button class="icon-btn logout" id="logout" type="button" title="Déconnexion" aria-label="Déconnexion"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H3"/></svg></button>
        </div>
      </div>
    </aside>

    <main class="main" id="view" tabindex="-1"><p class="loading">Chargement…</p></main>
  </div>

  <dialog class="modal" id="modal"></dialog>
  <div id="toasts" aria-live="polite"></div>

  <script src="/js/common.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
