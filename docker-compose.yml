services:
  mongodb:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/gestion_projet
      JWT_SECRET: ${JWT_SECRET:-change-moi-avec-un-secret-aleatoire-long}
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
